[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meal-management"
version = "0.1.0"
description = "Local meal journal, source-linked nutrition catalog and offline statistics"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "LeeJeaHyuk"}]
dependencies = []

[project.scripts]
meal-management = "meal_management.__main__:main"

[tool.setuptools.packages.find]
include = ["meal_management*"]
